<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolei</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <a href="index.html" class="logo">
        <img src="assets/images/mpalabolei.png" alt="Home">
        <span>Bolei</span> 
    </a>

    <div class="form-container">
        <div class="form-card">
            <div class="form-header">ΑΛΛΑΓΗ ΣΤΟΙΧΕΙΩΝ ΠΡΟΦΙΛ</div>
            <form id="change-form" class="result-form">
                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="firstname">Νέο Όνομα</label>
                        <input type="text" id="firstname" name="firstname">
                    </div>
                    <div class="form-section">
                        <label for="lastname">Νέο Επίθετο</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="phone">Νέο Τηλέφωνο</label>
                        <input type="tel" id="phone" name="phone">
                        <span class="error-msg" id="phone-error"></span>
                    </div>
                    <div class="form-section">
                        <label for="email">Νέο Email</label>
                        <input type="email" id="email" name="email">
                        <span class="error-msg" id="email-error"></span>
                    </div>
                </div>
                <div class="form-section">
                    <label for="password">Νέο Password</label>
                    <input type="password" id="password" name="password">
                    <span class="error-msg" id="password-error"></span>
                </div>
                <div class="form-section">
                    <label for="old-password">Παλιό Password *</label>
                    <input type="password" id="old-password" name="old-password" required>
                    <span class="error-msg" id="old-password-error"></span>
                </div>
                <button type="submit" class="submit-btn">ΑΠΟΘΗΚΕΥΣΗ</button>
            </form>
        </div>
    </div>
    <script>
        function clearErrors() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => input.style.borderColor = '#ccc');
            const errors = document.querySelectorAll('.error-msg');
            errors.forEach(error => error.textContent = '');
        }

        function showError(inputId, message) {
            document.getElementById(inputId).style.borderColor = 'red';
            const errorSpan = document.getElementById(inputId + '-error');
            if (errorSpan) {
                errorSpan.textContent = message;
            }
        }

        let currentUser = null;

        const formData = new FormData();
        formData.append('action', 'get_current_user');
        
        fetch('api/profiles.php', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(user => {
            if (!user) {
                alert("Παρακαλώ συνδεθείτε πρώτα.");
                window.location.href = "login.html";
            } else {
                currentUser = user;
                
                document.getElementById('change-form').addEventListener('submit', function(e){
                    e.preventDefault();
                    clearErrors();
                    let hasError = false;

                    const firstnameInput = document.getElementById("firstname").value;
                    if (firstnameInput) {
                        let firstNameHasDigit = false;
                        for (let i = 0; i < firstnameInput.length; i++) {
                            if (firstnameInput[i] >= '0' && firstnameInput[i] <= '9') {
                                firstNameHasDigit = true;
                                break;
                            }
                        }
                        if (firstNameHasDigit) {
                            showError("firstname", 'To όνομα περιλαμβάνει αριθμό!');
                            hasError = true;
                        }
                    }

                    const lastnameInput = document.getElementById("lastname").value;
                    if (lastnameInput) {
                        let lastNameHasDigit = false;
                        for (let i = 0; i < lastnameInput.length; i++) {
                            if (lastnameInput[i] >= '0' && lastnameInput[i] <= '9') {
                                lastNameHasDigit = true;
                                break;
                            }
                        }
                        if (lastNameHasDigit) {
                            showError("lastname", 'To επίθετο περιλαμβάνει αριθμό!');
                            hasError = true;
                        }
                    }

                    const phoneInput = document.getElementById("phone").value;
                    if (phoneInput) {
                        let phoneValid = true;
                        if (phoneInput.length !== 10) {
                            phoneValid = false;
                        } else {
                            for (let i = 0; i < phoneInput.length; i++) {
                                if (isNaN(phoneInput[i]) || phoneInput[i] === " ") {
                                    phoneValid = false;
                                    break;
                                }
                            }
                        }
                        if (!phoneValid) {
                            showError("phone", 'To τηλέφωνο πρέπει να αποτελείται από ακριβώς 10 ψηφία!');
                            hasError = true;
                        }
                    }

                    const passwordInput = document.getElementById("password").value;
                    if (passwordInput) {
                        let passwordValid = false;
                        if (passwordInput.length < 5) {
                            passwordValid = false;
                        } else {
                            const punctuation = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';              
                            for (const char of passwordInput){
                                if (punctuation.includes(char)){
                                    passwordValid = true;
                                    break;
                                }
                            }
                        }
                        if (!passwordValid){
                            showError("password", 'Ο κωδικός πρέπει να περιέχει τουλάχιστον ένα σημείο στίξης!');
                            hasError = true;
                        }
                    }

                    const oldPasswordInput = document.getElementById("old-password").value;
                    if (oldPasswordInput !== currentUser.password) {
                        showError("old-password", 'Λάθος κωδικός!'); 
                        hasError = true;
                    }

                    if (hasError) {
                        return;
                    }

                    const updateData = new FormData();
                    updateData.append('action', 'update');
                    updateData.append('firstname', firstnameInput || currentUser.firstname);
                    updateData.append('lastname', lastnameInput || currentUser.lastname);
                    updateData.append('phone', phoneInput || currentUser.phone);
                    updateData.append('email', document.getElementById("email").value || currentUser.email);
                    updateData.append('password', passwordInput || currentUser.password);

                    fetch('api/profiles.php', {
                        method: 'POST',
                        body: updateData
                    })
                    .then(res => res.text())
                    .then(text => {
                        if (text.trim() === 'success') {
                            alert("Τα στοιχεία ενημερώθηκαν επιτυχώς!");
                            currentUser.password = passwordInput || currentUser.password;
                            currentUser.firstname = firstnameInput || currentUser.firstname;
                            currentUser.lastname = lastnameInput || currentUser.lastname;
                            currentUser.phone = phoneInput || currentUser.phone;
                            currentUser.email = document.getElementById("email").value || currentUser.email;
                            
                            document.getElementById("old-password").value = "";
                            document.getElementById("password").value = "";
                        } else {
                            alert("Σφάλμα: " + text);
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
