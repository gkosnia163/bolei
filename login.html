<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolei</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <a href="index.html" class="logo">
        <img src="assets/images/mpalabolei.png" alt="Home">
        <span>Bolei</span> 
    </a>
    
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">ΣΥΝΔΕΣΗ ΧΡΗΣΤΗ</div>
            <form id="login-form" class="result-form">
                <div class="form-section">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                    <span class="error-msg" id="username-error"></span>
                </div>

                <div class="form-section">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <span class="error-msg" id="password-error"></span>
                </div>

                <button type="submit" class="submit-btn">Συνδεση</button>
                
                <p style="margin-top: 15px; font-size: 0.9rem;">Δεν έχετε λογαριασμό; <a href="sign-up.html" style="color: lightcoral; font-weight: bold;">Εγγραφή</a></p>
            </form>
        </div>
    </div>
    <script>
        function showError(inputId, message) {
            document.getElementById(inputId).style.borderColor = 'red';
            const errorSpan = document.getElementById(inputId + '-error');
            if (errorSpan) {
                errorSpan.textContent = message;
            }
        }

        document.getElementById('login-form').addEventListener('submit', function(e){
            e.preventDefault();

            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");

            const username = usernameInput.value;
            const password = passwordInput.value;

            const formData = new FormData();
            formData.append('action', 'login');
            formData.append('username', username);
            formData.append('password', password);

            fetch('api/profiles.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                if (text.trim() === 'success') {
                    window.location.href = 'index.html';
                } else {
                    usernameInput.style.borderColor = 'red';
                    showError("password", text);
                }
            })
            .catch(error => {
                alert('Σφάλμα σύνδεσης: ' + error);
            });
        });
    </script>
</body>
</html>
