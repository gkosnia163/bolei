<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html" class="logo">
        <img src="images/mpalabolei.png" alt="Home">
        <span>Bolei</span> 
    </a>
    
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">ΣΥΝΔΕΣΗ ΧΡΗΣΤΗ</div>
            <form id="login-form" class="result-form">
                <div class="form-section">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-section">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="submit-btn">Συνδεση</button>
                
                <p style="margin-top: 15px; font-size: 0.9rem;">Δεν έχετε λογαριασμό; <a href="sign-up.html" style="color: lightcoral; font-weight: bold;">Εγγραφή</a></p>
            </form>
        </div>
    </div>
</body>
</html>
