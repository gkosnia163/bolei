<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolei - Προσθήκη Ομάδας</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <a href="index.html" class="logo">
        <img src="assets/images/mpalabolei.png" alt="Home">
        <span>Bolei</span>
    </a>
    
    <div class="form-club-container">
        <div class="form-card">
            <div class="form-header">ΠΡΟΣΘΗΚΗ ΟΜΑΔΑΣ</div>
            <form id="add-club-form" class="club-form">

                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="team-name">Όνομα ομάδας*</label>
                        <input type="text" id="team-name" name="team_name" required>
                    </div>
                    <div class="form-section">
                        <label for="team-website">Σύνδεσμος site ομάδας*</label>
                        <input type="url" id="team-website" name="team_website" placeholder="https://..." required>
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="team-logo">Λογότυπο ομάδας*</label>
                        <input type="file" id="team-logo" name="team_logo" accept="image/*" required>
                    </div>
                    <div class="form-section">
                        <label for="team-photo">Φωτογραφία ομάδας*</label>
                        <input type="file" id="team-photo" name="team_photo" accept="image/*" required>
                    </div>
                </div>

                <div class="players-table-container">
                    <label>Παίκτες/Παίκτριες (Τουλάχιστον 12)*</label>
                    <table class="players-table">
                        <thead>
                            <tr>
                                <th>#*</th>
                                <th>Ονοματεπώνυμο*</th>
                                <th>Θέση *</th>
                                <th>Ύψος (m )*</th>
                                <th>Ημ. Γέννησης *</th>
                            </tr>
                        </thead>
                        <tbody>
                            <script>
                                for (let i = 1; i <= 12; i++) {
                                    document.write(`
                                        <tr>
                                            <td><input type="number" name="player_num_${i}" min="0" max="99" step="1" required></td>
                                            <td><input type="text" name="player_name_${i}" required></td>
                                            <td>
                                                <select name="player_pos_${i}" required>
                                                    <option value="">Επιλέξτε...</option>
                                                    <option value="Outside Hitter">Outside Hitter</option>
                                                    <option value="Libero">Libero</option>
                                                    <option value="Opposite">Opposite</option>
                                                    <option value="Setter">Setter</option>
                                                    <option value="Middle Blocker">Middle Blocker</option>
                                                </select>
                                            </td>
                                            <td><input type="number" name="player_height_${i}" min="1.00" max="2.30" step="0.01" required></td>
                                            <td><input type="date" name="player_dob_${i}" required></td>
                                        </tr>
                                    `);
                                }
                            </script>
                        </tbody>
                    </table>
                </div>

                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="coach-name">Όν/μο Προπονητή*</label>
                        <input type="text" id="coach-name" name="coach_name" required>
                    </div>
                    <div class="form-section">
                        <label for="trainer-name">Όν/μο Γυμναστή</label>
                        <input type="text" id="trainer-name" name="trainer_name">
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="form-section">
                        <label for="physio-name">Όν/μο Φυσικοθεραπευτή</label>
                        <input type="text" id="physio-name" name="physio_name">
                    </div>
                    <div class="form-section">
                        <label for="manager-name">Όν/μο Έφορου</label>
                        <input type="text" id="manager-name" name="manager_name">
                    </div>
                </div>

                <div class="form-section">
                    <label for="stats-name">Όν/μο Στατιστικολόγου</label>
                    <input type="text" id="stats-name" name="stats_name" style="width: 48.5%;">
                </div>

                <div class="form-section">
                    <label>Video (Αρχείο ή URL) *</label>
                    <div style="display: flex; gap: 20px;">
                        <input type="file" name="video_file" accept="video/*" style="flex: 1;">
                        <span style="align-self: center;">Ή</span>
                        <input type="url" name="video_url" placeholder="URL Video (π.χ. YouTube)" style="flex: 1;">
                    </div>
                    <small style="color: #666; font-size: 0.8rem; margin-top: 5px;">*Απαιτείται τουλάχιστον ένας από τους δύο τρόπους.</small>
                </div>

                <button type="submit" class="submit-btn">Υποβολη Ομαδας</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('add-club-form').addEventListener('submit', function(e) {
            const videoFile = this.elements['video_file'].value;
            const videoUrl = this.elements['video_url'].value;
            
            if (!videoFile && !videoUrl) {
                e.preventDefault();
                alert('Aνεβάστε ένα video ή προσθέστε ένα URL.');
            }
        });
    </script>
</body>
</html>
